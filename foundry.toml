# Settings mirror gluwa/usc-testnet-bridge-examples @ 4ff9a3bf so our contracts compile
# under the exact configuration the Attestcoin examples are validated against.
[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
cache_path = "contracts/cache"
libs = ["node_modules"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "shanghai"
# Tests decode REAL captured Attestcoin proofs, so they need read access to the fixtures.
fs_permissions = [{access = "read", path = "./contracts/test/fixtures"}]

# CI: skip fork tests (they need live RPC + a captured proof fixture).
[profile.ci]
no_match_path = "contracts/test/fork/*"

[rpc_endpoints]
cc3 = "${CC3_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
