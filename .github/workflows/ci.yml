name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Runs first and gates nothing else, deliberately: a leaked key is worth knowing about even if
  # the build is broken. Added after a throwaway demo key reached this public repo inside a
  # committed evidence JSON (docs/evidence/borrower-c-history.json, Aug 13 2026). The lesson was
  # that evidence files are published artifacts, and nothing had ever checked them.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no secret-shaped field names in tracked files
        run: |
          # A 32-byte hex string is indistinguishable from a transaction hash, so scanning for
          # 0x+64hex is useless here (this repo legitimately contains hundreds). Gate on the
          # thing that is never legitimate: a field or variable NAMED like a secret with a value.
          if git grep -InE '"(privateKey|private_key|secret|mnemonic|seedPhrase|apiKey|api_key|password)"[[:space:]]*:[[:space:]]*"[^"]+"' -- . ; then
            echo "::error::A secret-shaped field with a value is committed. Remove it and rotate the credential."
            exit 1
          fi
          if git grep -InE '(PRIVATE_KEY|API_KEY|SECRET|MNEMONIC)[[:space:]]*=[[:space:]]*["'"'"']?(0x)?[A-Za-z0-9_/+-]{16,}' -- . ':!.env.example' ; then
            echo "::error::A credential assignment with a real-looking value is committed."
            exit 1
          fi
          echo "No secret-shaped assignments in tracked files."
      - name: .env must never be tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked. It must be gitignored."
            exit 1
          fi
          echo ".env is not tracked."

  solidity:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Must run before forge: foundry.toml sets libs = ["node_modules"], so the
      # Gluwa and OpenZeppelin sources have to exist on disk before compilation.
      - run: npm ci
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build --sizes
      - run: FOUNDRY_PROFILE=ci forge test -vvv

  typescript:
    name: worker + scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Scripts import contract ABIs straight from forge's artifacts (a single source of truth,
      # no codegen step). contracts/out/ is gitignored, so it has to be built before tsc can
      # resolve those imports.
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
      - run: npm run typecheck
      - run: npm run lint
      # A hand-written frontend ABI does not fail loudly when it drifts — it decodes garbage, or
      # derives a topic0 that matches nothing and reads as "no history". That shipped three times.
      - run: npm run check:abi

  web:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
