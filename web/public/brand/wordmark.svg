<!--
  Wordmark. The maker's mark struck to the left of the name, at cap height, with the two counter-
  facing arcs sitting in the lozenge — the same lockup a silversmith punches: mark first, then the
  legend. Set in mono with open tracking because every legend on a hallmark is engraved, not typeset,
  and because mono is the typeface the on-chain badge already uses.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 48" fill="none" role="img" aria-label="CrossCredit">
  <title>CrossCredit</title>

  <g transform="translate(2 4)">
    <path d="M20 1 39 20 20 39 1 20Z" stroke="#EDE7DD" stroke-width="1.9" stroke-linejoin="round" opacity="0.45" />
    <path id="wc" d="M19.1 13a8.1 8.1 0 1 0 0 14.1" stroke="#EDE7DD" stroke-width="3" stroke-linecap="round" />
    <use href="#wc" transform="translate(40 0) scale(-1 1)" />
  </g>

  <text
    x="56" y="31"
    font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="21" font-weight="600" letter-spacing="3.4"
    fill="#EDE7DD"
  >CROSSCREDIT</text>
</svg>
