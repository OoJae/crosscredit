<!--
  Favicon. The maker's mark on a bench-black ground, with the lozenge weight raised and the
  cartouche opacity lifted so it holds together at 16px — a tab icon is the smallest a punch ever
  gets struck, and the hairline that reads on a hero disappears entirely at that size.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CrossCredit">
  <title>CrossCredit</title>
  <rect width="64" height="64" rx="12" fill="#0A0B0D" />
  <g fill="none" stroke="#EDE7DD" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 7 57 32 32 57 7 32Z" stroke-width="3" opacity="0.55" />
    <path d="M34 20a12 12 0 1 0 0 24" stroke-width="5" />
    <path d="M30 44a12 12 0 1 0 0-24" stroke-width="5" />
  </g>
</svg>
