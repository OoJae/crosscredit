<!--
  Assay office mark — Creditcoin.

  In a hallmark row this is the mark that says *which office tested the metal*. Here it says which
  chain verified the proof, which is the whole trust argument: no oracle we run, no multisig we
  control — the chain checked the evidence for itself.

  The glyph is a block with a proof path descending into it: two sibling steps (a Merkle path,
  each halving the search) meeting a heavy anvil line — the attested block they resolve against.
  Struck in vermilion, because this is the mark that certifies. Two siblings rather than three:
  three hairlines turned to mud below about 24px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 56" fill="none" role="img" aria-label="Verified on Creditcoin">
  <title>Assayed on Creditcoin</title>

  <!-- Rectangular office surround with clipped top corners. -->
  <path d="M4 12 12 4h24l8 8v40H4Z" stroke="#C8482A" stroke-width="2.5" stroke-linejoin="round" opacity="0.5" />

  <!-- The Merkle path: each step halves the search. -->
  <path d="M15 18h18M20 28h8" stroke="#C8482A" stroke-width="3.2" stroke-linecap="round" />

  <!-- The anvil — the attested block everything resolves against. -->
  <path d="M12 40h24" stroke="#C8482A" stroke-width="4.5" stroke-linecap="round" />
</svg>
