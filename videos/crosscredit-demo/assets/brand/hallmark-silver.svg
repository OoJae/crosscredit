<!--
  Fineness mark — Silver. Oval surround, the traditional cut for silver fineness.
  250 is the score floor. Colour locked to CreditTierSBT.sol `_tierColour`.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 56" fill="none" role="img" aria-label="Silver tier, from 250 points">
  <title>Silver — from 250</title>
  <ellipse cx="24" cy="28" rx="20" ry="24" stroke="#c0c0c0" stroke-width="2.5" />
  <text
    x="24" y="34"
    font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="15" font-weight="700" letter-spacing="0.5"
    fill="#c0c0c0" text-anchor="middle"
  >250</text>
</svg>
